<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Project Log · Automan Intertrade</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<meta name="theme-color" content="#1E5C3A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one working sheet. Project header and status counts on top, then a single
   schedule grid that mirrors the paper summary: process rows in pairs (PLAN green,
   ACTUAL amber) over a day-by-day timeline with a pink "today" column. */
:root{
  --w-proc:188px; --w-st:116px; --w-ty:64px;
  color-scheme:light;
  --bg:#F2F4F0; --surface:#FFFFFF; --surface-2:#E9EEE8;
  --ink:#17201B; --muted:#58665D; --line:#CBD5CD; --line-soft:#E1E8E2;
  --plan:#2C7A4B; --plan-ink:#FFFFFF; --plan-text:#1E5E39;
  --actual:#E6A92B; --actual-ink:#2A1E00; --actual-text:#7A5200;
  --today:#D5489A; --today-wash:rgba(213,72,154,.11);
  --weekend:#F0F3EF;
  --accent:#1E5C3A; --accent-ink:#FFFFFF;
  --danger:#B3362B; --danger-wash:#FBE7E4;
  --done-wash:#DEEFE4; --prog-wash:#FBEFD2; --todo-wash:#E7ECE8;
  --font-display:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --surface:#171D1A; --surface-2:#202823;
    --ink:#E5ECE7; --muted:#93A39A; --line:#34413B; --line-soft:#252F2A;
    --plan:#46A56F; --plan-ink:#07140C; --plan-text:#7ED6A2;
    --actual:#E3AE45; --actual-ink:#241800; --actual-text:#F0C46A;
    --today:#E26BB0; --today-wash:rgba(226,107,176,.14);
    --weekend:#1B221F;
    --accent:#5CC088; --accent-ink:#06140C;
    --danger:#FF8173; --danger-wash:#3A1D1A;
    --done-wash:#173022; --prog-wash:#33290F; --todo-wash:#252E29;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101513; --surface:#171D1A; --surface-2:#202823;
  --ink:#E5ECE7; --muted:#93A39A; --line:#34413B; --line-soft:#252F2A;
  --plan:#46A56F; --plan-ink:#07140C; --plan-text:#7ED6A2;
  --actual:#E3AE45; --actual-ink:#241800; --actual-text:#F0C46A;
  --today:#E26BB0; --today-wash:rgba(226,107,176,.14);
  --weekend:#1B221F;
  --accent:#5CC088; --accent-ink:#06140C;
  --danger:#FF8173; --danger-wash:#3A1D1A;
  --done-wash:#173022; --prog-wash:#33290F; --todo-wash:#252E29;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.45}
.app{max-width:1560px;margin-inline:auto;padding-inline:16px;padding-block:14px 56px;display:flex;flex-direction:column;gap:16px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0;flex-wrap:wrap}
.brand .logo{height:34px;width:auto;max-width:100%;display:block;background:#fff;border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.brand .appname{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
.switch select{min-width:0;max-width:100%;width:min(420px,calc(100vw - 32px));padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:6px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:var(--surface)}
.btn.editing{border-color:var(--plan);color:var(--plan-text)}
.btn[disabled]{opacity:.5;cursor:default}

/* project header */
.ph{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.ph-main{min-width:0;flex:1 1 420px}
.ph h1{margin:0 0 8px;font-family:var(--font-display);font-weight:600;font-size:clamp(28px,5vw,40px);line-height:1.05;letter-spacing:.005em;text-wrap:balance;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px 28px;margin:0}
.meta div{min-width:0}
.meta dt{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.meta dd{margin:0;font-weight:500;overflow-wrap:anywhere}

/* stats */
.stats{display:flex;align-items:center;gap:10px 22px;flex-wrap:wrap;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.prog{display:flex;align-items:center;gap:12px;flex:1 1 280px;min-width:0}
.prog-label{white-space:nowrap;font-weight:600}
.prog-track{flex:1;height:8px;border-radius:4px;background:var(--todo-wash);overflow:hidden;min-width:60px}
.prog-fill{height:100%;background:var(--plan)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pill.done{background:var(--done-wash);color:var(--plan-text)}
.pill.progress{background:var(--prog-wash);color:var(--actual-text)}
.pill.late{background:var(--danger-wash);color:var(--danger)}
.pill.todo{background:var(--todo-wash);color:var(--muted)}

/* toolbar */
.bar-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:18px;height:9px;border-radius:2px;display:inline-block}
.sw.plan{background:var(--plan)} .sw.actual{background:var(--actual)} .sw.today{background:var(--today);width:9px;height:14px}
.bar-actions{display:flex;gap:8px;flex-wrap:wrap}

/* schedule grid */
.sched-wrap{overflow:auto;max-height:78vh;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table.sched{border-collapse:separate;border-spacing:0;min-width:max-content;font-size:12.5px}
.sched th,.sched td{padding:0;border-right:1px solid var(--line-soft);border-bottom:1px solid var(--line-soft);background:var(--surface)}
.sched thead th{position:sticky;z-index:3;background:var(--surface-2);font-weight:600;color:var(--muted)}
.sched thead tr:first-child th{top:0;height:24px}
.sched thead tr:nth-child(2) th{top:24px;height:40px}
.sched thead th.h{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;text-align:left;padding:0 10px;vertical-align:middle;top:0}
.sched thead th.mo{text-align:left;padding:0 6px;font-size:11px;white-space:nowrap;overflow:hidden;color:var(--ink)}
.sched thead th.dd{width:var(--dw);min-width:var(--dw);max-width:var(--dw);text-align:center;line-height:1.1;font-family:var(--font-mono);font-weight:500}
.dd .dn{display:block;font-size:12px;color:var(--ink)}
.dd .dw{display:block;font-size:9.5px}
.sched thead th.we{background:var(--line-soft)}
.sched thead th.today{background:var(--today);color:#fff}
.sched thead th.today .dn,.sched thead th.today .dw{color:#fff}
.c-proc{width:var(--w-proc);min-width:var(--w-proc);max-width:var(--w-proc)}
.c-dt{width:66px;min-width:66px}
.c-who{width:92px;min-width:92px}
.c-st{width:var(--w-st);min-width:var(--w-st);max-width:var(--w-st)}
.c-ty{width:var(--w-ty);min-width:var(--w-ty);max-width:var(--w-ty)}
td.proc{padding:6px 10px;vertical-align:middle;border-right:1px solid var(--line)}
/* frozen columns: Process, Status and PLAN/ACTUAL stay put while the calendar scrolls */
.sched .c-proc,.sched .c-st,.sched .c-ty{position:sticky;z-index:2}
.sched .c-proc{left:0}
.sched .c-st{left:var(--w-proc)}
.sched .c-ty{left:calc(var(--w-proc) + var(--w-st));border-right:2px solid var(--line)}
.sched thead th.c-proc,.sched thead th.c-st,.sched thead th.c-ty{z-index:5;top:0}
.sched td.c-ty.plan,.sched td.c-ty.act{box-shadow:2px 0 0 var(--line)}
.pill.pname-st{display:none;margin-top:5px}
.pname{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer;font-weight:600;font-size:13px;line-height:1.3;overflow-wrap:anywhere}
.pname:hover{text-decoration:underline;text-underline-offset:3px}
.pname.ro{cursor:default}
.pname.ro:hover{text-decoration:none}
td.dt{padding:0 8px;font-size:12px;white-space:nowrap;color:var(--ink);height:26px}
td.dt.dim{color:var(--muted)}
td.who{padding:0 10px;vertical-align:middle;overflow-wrap:anywhere}
td.st{padding:6px 8px;vertical-align:middle}
.st-in{display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.late-note{font-size:10.5px;color:var(--muted);font-family:var(--font-mono)}
.mini{background:none;border:1px solid var(--line);border-radius:4px;padding:1px 7px;font-size:11px;cursor:pointer;color:var(--ink)}
.mini:hover{background:var(--surface-2)}
td.ty{text-align:center;font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.1em}
td.ty.plan{background:var(--plan);color:var(--plan-ink)}
td.ty.act{background:var(--actual);color:var(--actual-ink)}
td.d{position:relative;width:var(--dw);min-width:var(--dw);max-width:var(--dw);height:26px}
.sched-wrap{--dw:28px;cursor:default}
.sched td.d,.sched th.dd,.sched th.mo{cursor:grab;user-select:none;-webkit-user-select:none}
.sched-wrap.dragging,.sched-wrap.dragging *{cursor:grabbing!important}
td.d.we{background:var(--weekend)}
td.d.today{background:var(--today-wash)}
tr.last td,tr.last th{border-bottom-color:var(--line)}
.bar{position:absolute;top:6px;bottom:6px;left:0;right:-1px;z-index:1}
.bar.plan{background:var(--plan)}
.bar.actual{background:var(--actual)}
.bar.s{left:2px;border-top-left-radius:4px;border-bottom-left-radius:4px}
.bar.e{right:1px;border-top-right-radius:4px;border-bottom-right-radius:4px}
.bar.live.e{border-radius:0;background:repeating-linear-gradient(135deg,var(--actual) 0 4px,transparent 4px 8px)}
.bar.live.s.e{border-radius:4px 0 0 4px}
tr.grp th.gh{position:sticky;left:0;z-index:2;background:var(--surface-2);padding:6px 10px;text-align:left;border-right:1px solid var(--line);border-top:1px solid var(--line)}
.gh-in{display:flex;align-items:center;justify-content:space-between;gap:6px 8px;flex-wrap:wrap}
.gname{font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:.07em;text-transform:uppercase}
tr.grp td.gfill{background:var(--surface-2);font-size:11.5px;color:var(--muted);padding:0 10px;border-top:1px solid var(--line);white-space:nowrap}
.empty{padding:40px 20px;text-align:center;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty h2{margin:0;font-family:var(--font-display);font-size:26px;color:var(--ink);font-weight:600}
.empty p{margin:0;max-width:46ch}
.empty .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.empty.big{padding:72px 20px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(8,12,10,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(580px,100%);max-height:100%;overflow:auto;padding:20px}
.sheet.narrow{width:min(400px,100%)}
.sheet h2{margin:0 0 14px;font-family:var(--font-display);font-size:26px;font-weight:600}
.sheet p.note{margin:0 0 12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2 .full{grid-column:1/-1}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.fld input[type=text],.fld input[type=date],.fld input[type=password]{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:0}
.sec{grid-column:1/-1;display:flex;align-items:center;gap:8px;margin-top:4px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;font-weight:600}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec.p{color:var(--plan-text)} .sec.a{color:var(--actual-text)}
.check{display:flex;gap:8px;align-items:center;flex-direction:row}
.err{color:var(--danger);margin:10px 0 0;min-height:1.2em;font-size:13px}
.actions{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.actions .r{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;z-index:60;max-width:calc(100% - 32px);font-size:13px}
.toast.bad{background:var(--danger);color:#fff}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* subject */
.subject{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.sub-head{display:flex;align-items:center;gap:10px;padding:10px 14px;flex-wrap:wrap}
.sub-head h2{margin:0;font-family:var(--font-display);font-size:20px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.sub-head .count{color:var(--muted);font-size:12px}
.sub-head .sp{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.sub-body{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:0 14px 14px}
@media (min-width:900px){.sub-body.both{grid-template-columns:minmax(0,1fr) minmax(240px,340px)}}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;align-content:start}
.shot{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.shot-img{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.shot-img .open{display:block;width:100%;height:100%;padding:0;border:0;background:none;cursor:zoom-in}
.shot-img img{width:100%;height:100%;object-fit:contain;display:block}
.shot-img .edit{position:absolute;top:6px;right:6px;background:var(--surface)}
.shot figcaption{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.notes-box h3{margin:0 0 6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.notes-box p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.sub-empty{color:var(--muted);margin:0}
.lightbox{position:fixed;inset:0;background:rgba(6,9,8,.9);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.lightbox img{max-width:100%;max-height:calc(100% - 110px);object-fit:contain;border-radius:4px;background:#fff}
.lb-bar{display:flex;gap:8px;align-items:center;color:#fff;flex-wrap:wrap;justify-content:center}
.lb-bar .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.35)}
.lb-cap{color:#fff;text-align:center;max-width:70ch;overflow-wrap:anywhere}
.fld textarea{width:100%;min-height:96px;resize:vertical;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:inherit;min-width:0}
.preview{max-width:100%;max-height:240px;object-fit:contain;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);display:block}
.mv{display:flex;gap:4px;margin-top:5px}
.gh-btns{display:flex;gap:6px}
.help{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px;color:var(--muted)}
.help summary{cursor:pointer;font-weight:600;color:var(--ink)}
.help ul{margin:10px 0 2px;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.help b{color:var(--ink);font-weight:600}
@media (max-width:640px){
  :root{--w-proc:118px; --w-st:104px; --w-ty:54px}
  .sched .c-st{position:static}
  .sched thead th.c-st{position:sticky;left:auto;top:0;z-index:3}
  .sched .c-ty{left:var(--w-proc)}
  .pill.pname-st{display:inline-flex}
  .sched-wrap{max-height:72vh}
  .brand .appname{font-size:18px}
  .drag-hint{display:none}
}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:flex-end;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:8px}
.fl{display:flex;flex-direction:column;gap:3px;min-width:0}
.fl label{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.fl select,.fl input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:0;max-width:100%}
.fl.q{flex:2 1 220px}
.fl.q input{width:100%}
.fl.sel{flex:1 1 140px}
.fl.sel select{width:100%}
.f-count{margin-left:auto;color:var(--muted);font-size:12px;align-self:center;white-space:nowrap}
/* calendar controls */
.calnav{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;margin-bottom:-6px}
.cn-btns{display:flex;gap:6px;flex-wrap:wrap}
.cn-btns .btn{padding:6px 10px}
.cn-slider{flex:1 1 240px;display:flex;align-items:center;min-width:160px}
#calSlider{width:100%;height:30px;accent-color:var(--accent);cursor:pointer;margin:0}
.zoom{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.zoom select{padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.drag-hint{color:var(--muted);font-size:12px}
.sched-wrap:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* project banner rows in the All projects view */
tr.prow th.gh.pj{background:var(--accent);color:var(--accent-ink);border-top-color:var(--accent);padding:7px 10px}
tr.prow td.gfill{background:var(--accent);color:var(--accent-ink);border-top-color:var(--accent)}
.pj-in{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pj-t{min-width:0}
.pj-name{display:block;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.03em;line-height:1.15;overflow-wrap:anywhere}
.pj-sub{display:block;font-size:11px;opacity:.9;overflow-wrap:anywhere}
.pj .mini{color:var(--accent-ink);border-color:currentColor}
.pj .mini:hover{background:rgba(255,255,255,.18)}

/* devices: iOS / Android / desktop */
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);-webkit-tap-highlight-color:transparent}
.app{padding-bottom:calc(56px + env(safe-area-inset-bottom,0px))}
.sched-wrap{max-height:78vh;max-height:78dvh;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.scrim{overscroll-behavior:contain}
.st-sel{font-size:12px;padding:3px 4px;border:1px solid var(--line);border-radius:4px;background:var(--surface);color:var(--ink);max-width:100%;width:100%}
.fld select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);min-width:0}
input[type=date]{min-height:38px;max-width:100%}
.fl input[type=search]{-webkit-appearance:none;appearance:none}
@media (max-width:900px){
  input,select,textarea{font-size:16px!important}  /* stops iOS zooming into fields */
  :root{--w-st:144px}
  .st-sel{padding:3px 2px}
}
@media (max-width:640px){
  .sched-wrap{max-height:72vh;max-height:72dvh}
  .top{gap:8px}
  .top .btn{flex:0 0 auto}
}

  .btn{min-height:42px}
  .mini{min-height:32px;padding:4px 10px}
  .st-sel{min-height:34px}
  .fl select,.fl input,.fld input,.fld select,.zoom select,.switch select{min-height:42px}
  #calSlider{height:42px}
  .pname{padding:4px 0}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app" id="app"><div class="empty big"><p>Loading projects…</p></div></div>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script>
(function(){
  var MS = 86400000;
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var WD = ['S','M','T','W','T','F','S'];
  var TEMPLATE = [
    ['ME Design', ['3D Design','Drawing','BOM']],
    ['EE Design', ['EE Design','Drawing','BOM']],
    ['Parts Order [PR]', ['Fab. Parts','Std. Parts']],
    ['Automation', ['Assembly','Wiring','I/O Check','Programmable','Setup Finetune','Test Run','Delivery','Installation Setup','Handover / Train']]
  ];
  var POLL_MS = 10000;

  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function parse(s){
    if(!s || !/^\d{4}-\d{2}-\d{2}$/.test(s)) return null;
    var p = s.split('-').map(Number);
    return Math.round(Date.UTC(p[0], p[1]-1, p[2]) / MS);
  }
  function toDate(n){ return new Date(n * MS); }
  function iso(n){ return toDate(n).toISOString().slice(0,10); }
  function fmt(n){ if(n == null) return '—'; var d = toDate(n); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]; }
  function fmtY(n){ return fmt(n) + ' ' + toDate(n).getUTCFullYear(); }
  function todayN(){ var d = new Date(); return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / MS); }
  var TODAY = todayN();

  var projects = [], allTasks = [], tasks = [], allImages = [], images = [];
  var projectsLoaded = false, loadFailed = false, lastSig = '';
  var selectedId = null, needScroll = false;
  var editKey = '', canEdit = false;
  var modalState = null;
  var ALL = '__all__';
  var filters = { q: '', client: '', who: '', group: '', status: '', time: '', from: '', to: '' };
  var DW = (function(){ var n = parseInt(lsGet('projectlog.dw'), 10); return [20, 28, 40, 56].indexOf(n) >= 0 ? n : 28; })();

  var appEl = document.getElementById('app');
  var modalEl = document.getElementById('modal');
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function toast(msg, bad){
    toastEl.textContent = msg; toastEl.className = 'toast' + (bad ? ' bad' : ''); toastEl.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.hidden = true; }, 3200);
  }
  function lsGet(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }
  function lsSet(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  function lsDel(k){ try { localStorage.removeItem(k); } catch(e){} }

  /* ---------- API ---------- */
  function api(method, path, body, keyOverride){
    var headers = {}, key = keyOverride != null ? keyOverride : editKey;
    if(key) headers['x-edit-key'] = key;
    var opts = { method: method, headers: headers };
    if(body !== undefined){ headers['content-type'] = 'application/json'; opts.body = JSON.stringify(body); }
    return fetch(path, opts).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(j){
        if(!r.ok){ var e = new Error(j.error || 'Request failed'); e.status = r.status; throw e; }
        return j;
      });
    });
  }

  function load(force){
    return api('GET', '/api/data').then(function(d){
      loadFailed = false;
      var sig = JSON.stringify(d);
      if(!force && projectsLoaded && sig === lastSig) return;
      lastSig = sig;
      projects = d.projects || []; allTasks = d.tasks || []; allImages = d.images || []; projectsLoaded = true;
      var found = (selectedId === ALL && projects.length > 1) || projects.some(function(p){ return p.id === selectedId; });
      if(!found){
        var stored = lsGet('projectlog.selected');
        var pick = projects.filter(function(p){ return p.id === stored; })[0] || projects[0];
        selectedId = (stored === ALL && projects.length > 1) ? ALL : (pick ? pick.id : null); needScroll = true;
      }
      setScope();
      render();
    }).catch(function(){
      if(!projectsLoaded){ loadFailed = true; render(); }
    });
  }

  function selectProject(id){
    selectedId = id; needScroll = true;
    if(id) lsSet('projectlog.selected', id);
    if(id !== ALL && filters.client){
      var pr = projects.filter(function(x){ return x.id === id; })[0];
      if(pr && (pr.client || '') !== filters.client) filters.client = '';
    }
    setScope();
    render();
  }

  /* ---------- data helpers ---------- */
  function groupsOf(list){
    var map = {}, arr = [];
    list.forEach(function(t){
      if(!map[t.group]){ map[t.group] = { name: t.group, tasks: [], min: Infinity, max: -Infinity }; arr.push(map[t.group]); }
      var g = map[t.group]; g.tasks.push(t); g.min = Math.min(g.min, t.order); g.max = Math.max(g.max, t.order);
    });
    arr.sort(function(a,b){ return a.min - b.min; });
    arr.forEach(function(g){ g.tasks.sort(function(a,b){ return a.order - b.order; }); });
    return arr;
  }
  function orderFor(group, exceptId, pid){
    var list = projTasks(pid == null ? selectedId : pid).filter(function(t){ return t.id !== exceptId; });
    var gs = groupsOf(list);
    for(var i = 0; i < gs.length; i++){ if(gs[i].name === group) return gs[i].max + 1; }
    var mx = 0; list.forEach(function(t){ mx = Math.max(mx, t.order); });
    return Math.floor(mx / 1000) * 1000 + 1000;
  }
  function templateTasks(){
    var out = [];
    TEMPLATE.forEach(function(g, gi){
      g[1].forEach(function(n, ti){ out.push({ group: g[0], name: n, order: (gi + 1) * 1000 + (ti + 1) * 10 }); });
    });
    return out;
  }
  function statusOf(t){
    var pd = parse(t.planDue), as = parse(t.actStart), ae = parse(t.actEnd);
    if(ae != null) return 'done';
    if(as != null) return (pd != null && TODAY > pd) ? 'late' : 'progress';
    return (pd != null && TODAY > pd) ? 'late' : 'todo';
  }
  var STATUS_LABEL = { done: 'Done', progress: 'In progress', late: 'Overdue', todo: 'Not started' };

  function rangeOf(list){
    var min = Infinity, max = -Infinity;
    function see(n){ if(n != null){ if(n < min) min = n; if(n > max) max = n; } }
    list.forEach(function(t){
      var as = parse(t.actStart), ae = parse(t.actEnd);
      see(parse(t.planStart)); see(parse(t.planDue)); see(as); see(ae);
      if(as != null && ae == null) see(Math.max(as, TODAY));
    });
    if(min === Infinity){ min = TODAY - 2; max = TODAY + 18; }
    if(TODAY > max && TODAY - max <= 14) max = TODAY;
    if(TODAY < min && min - TODAY <= 14) min = TODAY;
    min -= 1; max += 2;
    if(max - min < 20) max = min + 20;
    return [min, max];
  }

  /* ---------- rendering ---------- */
  function currentProject(){ for(var i = 0; i < projects.length; i++) if(projects[i].id === selectedId) return projects[i]; return null; }

  function setScope(){
    if(selectedId === ALL){ tasks = allTasks; images = []; }
    else {
      tasks = allTasks.filter(function(t){ return t.projectId === selectedId; });
      images = allImages.filter(function(t){ return t.projectId === selectedId; });
    }
  }
  function projTasks(pid){ return allTasks.filter(function(t){ return t.projectId === pid; }); }

  function logoHTML(){
    return '<img class="logo" src="/logo.png" alt="Automan Intertrade Co., Ltd."><span class="appname">Project Log</span>';
  }

  /* ---------- filters ---------- */
  var TIME_OPTS = [['', 'Any time'], ['week', 'This week'], ['2weeks', 'Next 2 weeks'], ['month', 'This month'], ['nextmonth', 'Next month'], ['last30', 'Last 30 days'], ['custom', 'Custom range…']];
  var STATUS_OPTS = [['', 'Any status'], ['open', 'Not done'], ['progress', 'In progress'], ['late', 'Overdue'], ['todo', 'Not started'], ['done', 'Done']];
  var ZOOMS = [[20, 'Compact'], [28, 'Normal'], [40, 'Wide'], [56, 'Extra wide']];

  function uniq(arr){
    var m = {}, o = [];
    arr.forEach(function(x){ if(x && !m[x]){ m[x] = 1; o.push(x); } });
    return o.sort(function(a, b){ return a.localeCompare(b); });
  }
  function taskSpan(t){
    var as = parse(t.actStart), ae = parse(t.actEnd);
    var a = [parse(t.planStart), parse(t.planDue), as, ae].filter(function(x){ return x != null; });
    if(as != null && ae == null) a.push(Math.max(as, TODAY));
    if(!a.length) return null;
    return [Math.min.apply(null, a), Math.max.apply(null, a)];
  }
  function windowOf(){
    var f = filters.time;
    if(!f) return null;
    var wd = (toDate(TODAY).getUTCDay() + 6) % 7, mon = TODAY - wd;
    var d = toDate(TODAY), y = d.getUTCFullYear(), m = d.getUTCMonth();
    function u(yy, mm, dd){ return Math.round(Date.UTC(yy, mm, dd) / MS); }
    if(f === 'week') return [mon, mon + 6];
    if(f === '2weeks') return [TODAY, TODAY + 13];
    if(f === 'last30') return [TODAY - 30, TODAY];
    if(f === 'month') return [u(y, m, 1), u(y, m + 1, 0)];
    if(f === 'nextmonth') return [u(y, m + 1, 1), u(y, m + 2, 0)];
    if(f === 'custom'){
      var a = parse(filters.from), b = parse(filters.to);
      if(a == null && b == null) return null;
      if(a != null && b != null && b < a){ var x = a; a = b; b = x; }
      return [a, b];
    }
    return null;
  }
  function filtersActive(){
    return !!(filters.q || filters.client || filters.who || filters.group || filters.status || filters.time);
  }
  function filterTasks(list){
    var q = filters.q.trim().toLowerCase(), w = windowOf(), pm = {};
    projects.forEach(function(p){ pm[p.id] = p; });
    return list.filter(function(t){
      var p = pm[t.projectId] || {};
      if(filters.client && (p.client || '') !== filters.client) return false;
      if(filters.who && (t.incharge || '') !== filters.who) return false;
      if(filters.group && t.group !== filters.group) return false;
      if(filters.status){
        var s = statusOf(t);
        if(filters.status === 'open'){ if(s === 'done') return false; }
        else if(s !== filters.status) return false;
      }
      if(q){
        var hay = [p.name, p.client, p.po, t.group, t.name, t.incharge].join(' ').toLowerCase();
        if(hay.indexOf(q) < 0) return false;
      }
      if(w){
        var sp = taskSpan(t);
        if(!sp) return false;
        if(w[0] != null && sp[1] < w[0]) return false;
        if(w[1] != null && sp[0] > w[1]) return false;
      }
      return true;
    });
  }
  function calRange(list){
    var base = rangeOf(list), w = windowOf();
    if(!w) return base;
    var lo = w[0] != null ? w[0] : base[0], hi = w[1] != null ? w[1] : base[1];
    if(hi < lo){ var x = lo; lo = hi; hi = x; }
    if(hi - lo < 13) hi = lo + 13;
    if(hi - lo > 400) hi = lo + 400;
    return [lo, hi];
  }
  function optHTML(list, cur, allLabel){
    return '<option value="">' + allLabel + '</option>' + list.map(function(x){
      return '<option value="' + esc(x) + '"' + (x === cur ? ' selected' : '') + '>' + esc(x) + '</option>';
    }).join('');
  }
  function pairsHTML(pairs, cur){
    return pairs.map(function(o){ return '<option value="' + o[0] + '"' + (String(o[0]) === String(cur) ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('');
  }
  function selHTML(id, label, inner){
    return '<div class="fl sel"><label for="' + id + '">' + label + '</label><select id="' + id + '">' + inner + '</select></div>';
  }
  function filterBarHTML(lists, shown, total){
    var h = '<section class="filters" aria-label="Filters">' +
      '<div class="fl q"><label for="flt-q">Search</label><input id="flt-q" type="search" placeholder="Project, client, PO, process, person" value="' + esc(filters.q) + '" autocomplete="off"></div>' +
      selHTML('flt-client', 'Client', optHTML(lists.clients, filters.client, 'All clients')) +
      selHTML('flt-who', 'In charge', optHTML(lists.whos, filters.who, 'Everyone')) +
      selHTML('flt-group', 'Main process', optHTML(lists.groups, filters.group, 'All processes')) +
      selHTML('flt-status', 'Status', pairsHTML(STATUS_OPTS, filters.status)) +
      selHTML('flt-time', 'Time', pairsHTML(TIME_OPTS, filters.time));
    if(filters.time === 'custom'){
      h += '<div class="fl"><label for="flt-from">From</label><input id="flt-from" type="date" value="' + esc(filters.from) + '"></div>' +
        '<div class="fl"><label for="flt-to">To</label><input id="flt-to" type="date" value="' + esc(filters.to) + '"></div>';
    }
    h += '<div class="f-count mono">' + shown + ' of ' + total + ' processes</div>';
    if(filtersActive()) h += '<button class="btn" data-act="reset-filters">Reset filters</button>';
    return h + '</section>';
  }
  function calNavHTML(){
    return '<div class="calnav"><div class="cn-btns">' +
      '<button class="btn" data-act="cal-prev" data-days="30" title="Back one month">« Month</button>' +
      '<button class="btn" data-act="cal-prev" data-days="7" title="Back one week">‹ Week</button>' +
      '<button class="btn primary" data-act="cal-today">Today</button>' +
      '<button class="btn" data-act="cal-next" data-days="7" title="Forward one week">Week ›</button>' +
      '<button class="btn" data-act="cal-next" data-days="30" title="Forward one month">Month »</button></div>' +
      '<div class="cn-slider"><input id="calSlider" type="range" min="0" max="0" value="0" step="1" aria-label="Slide the calendar left and right"></div>' +
      '<label class="zoom">Zoom<select id="zoomSel">' + pairsHTML(ZOOMS, DW) + '</select></label>' +
      '<span class="drag-hint">Drag the calendar to move it</span></div>';
  }

  /* ---------- calendar movement ---------- */
  function frozenW(wrap){
    var t = wrap.querySelector('thead th.c-ty');
    if(!t) return 0;
    return (parseFloat(getComputedStyle(t).left) || 0) + t.offsetWidth;
  }
  function scrollToToday(wrap, smooth){
    var th = wrap.querySelector('th.dd.today'), left;
    if(th) left = th.offsetLeft - frozenW(wrap) - Math.min(160, wrap.clientWidth * 0.2);
    else {
      var first = wrap.querySelector('th.dd'), tn = first ? first.getAttribute('data-n') : null;
      left = (tn != null && TODAY > +tn) ? wrap.scrollWidth : 0;
    }
    wrap.scrollTo({ left: Math.max(0, left), behavior: smooth ? 'smooth' : 'auto' });
  }
  function syncSlider(){
    var w = appEl.querySelector('.sched-wrap'), s = document.getElementById('calSlider');
    if(!w || !s) return;
    s.max = Math.max(0, w.scrollWidth - w.clientWidth);
    s.value = Math.round(w.scrollLeft);
  }
  function setZoom(n){
    var w = appEl.querySelector('.sched-wrap');
    DW = n; lsSet('projectlog.dw', String(n));
    if(!w) return;
    var ratio = (w.scrollLeft + w.clientWidth / 2) / (w.scrollWidth || 1);
    w.style.setProperty('--dw', n + 'px');
    w.scrollLeft = ratio * w.scrollWidth - w.clientWidth / 2;
    syncSlider();
  }

  /* ---------- rendering ---------- */
  function render(){
    var wrap = appEl.querySelector('.sched-wrap');
    var sl = wrap ? wrap.scrollLeft : 0, st = wrap ? wrap.scrollTop : 0;
    var fa = document.activeElement, fid = null, fs = 0, fe = 0;
    if(fa && fa.id && /^flt-/.test(fa.id) && appEl.contains(fa)){ fid = fa.id; try { fs = fa.selectionStart; fe = fa.selectionEnd; } catch(x){} }
    TODAY = todayN();

    if(loadFailed){
      appEl.innerHTML = '<div class="empty big"><h2>Could not load the log</h2><p>Check your connection and try again.</p><div class="row"><button class="btn primary" data-act="retry">Try again</button></div></div>';
      return;
    }
    if(!projectsLoaded){ appEl.innerHTML = '<div class="empty big"><p>Loading projects…</p></div>'; return; }

    var isAll = selectedId === ALL;
    var topBar = '<header class="top"><div class="brand">' + logoHTML() + '</div>';
    if(projects.length){
      var opts = '';
      if(projects.length > 1) opts += '<option value="' + ALL + '"' + (isAll ? ' selected' : '') + '>All projects (' + projects.length + ')</option>';
      projects.forEach(function(p){
        if(filters.client && (p.client || '') !== filters.client && p.id !== selectedId) return;
        opts += '<option value="' + esc(p.id) + '"' + (p.id === selectedId ? ' selected' : '') + '>' + esc(p.name || 'Untitled') + (p.po ? ' · PO ' + esc(p.po) : '') + '</option>';
      });
      topBar += '<label class="switch"><span class="sr">Project</span><select id="projectSelect">' + opts + '</select></label>';
    }
    if(canEdit){
      topBar += '<button class="btn primary" data-act="new-project">New project</button>' +
        '<button class="btn editing" data-act="lock" title="Turn editing off on this device">Editing on · Lock</button>';
    } else {
      topBar += '<button class="btn" data-act="unlock">Unlock editing</button>';
    }
    topBar += '</header>';

    var p = isAll ? null : currentProject();
    if(!isAll && !p){
      appEl.innerHTML = topBar + '<div class="empty big"><h2>No projects yet</h2>' +
        (canEdit
          ? '<p>Create a project with its client and PO number, then log each process with a start date, due date and person in charge.</p><div class="row"><button class="btn primary" data-act="new-project">Create the first project</button></div>'
          : '<p>Nothing has been logged yet. An editor can unlock editing and create the first project.</p>') + '</div>';
      return;
    }

    /* filters (drop values that no longer exist in this view) */
    var scope = tasks;
    var lists = { clients: uniq(projects.map(function(x){ return x.client; })), whos: uniq(scope.map(function(t){ return t.incharge; })), groups: uniq(scope.map(function(t){ return t.group; })) };
    if(filters.client && lists.clients.indexOf(filters.client) < 0) filters.client = '';
    if(filters.who && lists.whos.indexOf(filters.who) < 0) filters.who = '';
    if(filters.group && lists.groups.indexOf(filters.group) < 0) filters.group = '';
    var list = filterTasks(scope);

    var dates = [];
    (isAll ? list : scope).forEach(function(t){ var a = parse(t.planStart), b = parse(t.planDue); if(a != null) dates.push(a); if(b != null) dates.push(b); });
    var sched = dates.length ? fmtY(Math.min.apply(null, dates)) + ' – ' + fmtY(Math.max.apply(null, dates)) : 'Not scheduled yet';

    var counts = { done: 0, progress: 0, late: 0, todo: 0 };
    list.forEach(function(t){ counts[statusOf(t)]++; });
    var total = list.length, pct = total ? Math.round(counts.done / total * 100) : 0;

    var html = topBar;
    if(isAll){
      var pids = {}, cls = {};
      list.forEach(function(t){ pids[t.projectId] = 1; });
      projects.forEach(function(x){ if(pids[x.id] && x.client) cls[x.client] = 1; });
      html += '<section class="ph"><div class="ph-main"><h1>All projects</h1>' +
        '<dl class="meta"><div><dt>Projects</dt><dd class="mono">' + Object.keys(pids).length + '</dd></div>' +
        '<div><dt>Clients</dt><dd class="mono">' + Object.keys(cls).length + '</dd></div>' +
        '<div><dt>Planned</dt><dd class="mono">' + esc(sched) + '</dd></div></dl></div></section>';
    } else {
      html += '<section class="ph"><div class="ph-main"><h1>' + esc(p.name || 'Untitled project') + '</h1>' +
        '<dl class="meta"><div><dt>Client</dt><dd>' + (esc(p.client) || '—') + '</dd></div>' +
        '<div><dt>PO No.</dt><dd class="mono">' + (esc(p.po) || '—') + '</dd></div>' +
        '<div><dt>Planned</dt><dd class="mono">' + esc(sched) + '</dd></div></dl></div>' +
        (canEdit ? '<div class="bar-actions"><button class="btn" data-act="edit-project">Edit project</button><button class="btn" data-act="duplicate-project">Duplicate</button></div>' : '') + '</section>';
    }

    html += '<section class="stats" aria-label="Progress"><div class="prog"><span class="prog-label mono">' + counts.done + ' of ' + total + ' done</span>' +
      '<div class="prog-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' + pct + '"><div class="prog-fill" style="width:' + pct + '%"></div></div></div>' +
      '<div class="chips">' +
      '<span class="pill progress"><i></i>' + counts.progress + ' in progress</span>' +
      '<span class="pill late"><i></i>' + counts.late + ' overdue</span>' +
      '<span class="pill todo"><i></i>' + counts.todo + ' not started</span></div></section>';

    if(!isAll) html += subjectHTML(p);

    html += filterBarHTML(lists, list.length, scope.length);

    html += '<div class="bar-row"><div class="legend"><span><i class="sw plan"></i>Plan</span><span><i class="sw actual"></i>Actual</span><span><i class="sw today"></i>Today, ' + fmtY(TODAY) + '</span></div>' +
      '<div class="bar-actions">' + (canEdit && !isAll ? '<button class="btn" data-act="add-task" data-group="">Add process</button>' : '') + '</div></div>';

    if(!scope.length){
      html += '<div class="sched-wrap"><div class="empty"><h2>No processes logged</h2>' +
        (canEdit && !isAll
          ? '<p>Start from the standard set (ME design, EE design, parts order, automation) or add your own processes one by one.</p><div class="row"><button class="btn primary" data-act="load-template">Load standard processes</button><button class="btn" data-act="add-task" data-group="">Add process</button></div>'
          : '<p>No processes have been added yet.</p>') + '</div></div>';
    } else if(!list.length){
      html += '<div class="sched-wrap"><div class="empty"><h2>Nothing matches these filters</h2><p>Try a wider time range or clear a filter.</p><div class="row"><button class="btn primary" data-act="reset-filters">Reset filters</button></div></div></div>';
    } else {
      html += calNavHTML() + '<div class="sched-wrap" tabindex="0" aria-label="Schedule calendar" style="--dw:' + DW + 'px">' + tableHTML(list, isAll) + '</div>';
    }
    if(canEdit) html += helpHTML();
    appEl.innerHTML = html;

    var w2 = appEl.querySelector('.sched-wrap');
    if(w2 && w2.querySelector('table')){
      if(needScroll){ scrollToToday(w2, false); needScroll = false; }
      else { w2.scrollLeft = sl; w2.scrollTop = st; }
      syncSlider();
    }
    if(fid){
      var f2 = document.getElementById(fid);
      if(f2){ f2.focus(); try { f2.setSelectionRange(fs, fe); } catch(x){} }
    }
  }

  function barCells(r0, r1, s, e, kind, live, tip){
    var out = '';
    for(var n = r0; n <= r1; n++){
      var dow = toDate(n).getUTCDay();
      var cls = 'd' + (dow === 0 || dow === 6 ? ' we' : '') + (n === TODAY ? ' today' : '');
      var inner = '';

  function compress(file){
    return new Promise(function(resolve, reject){
      var bad = function(){ var e = new Error('Could not read that image. Use a JPG or PNG.'); e.status = 400; reject(e); };
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function(){
        var max = 1600, scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        var q = 0.82, tries = 0;
        function attempt(){
          var c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(img.naturalWidth * scale)); c.height = Math.max(1, Math.round(img.naturalHeight * scale));
          var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
          var d = c.toDataURL('image/jpeg', q), b64 = d.slice(d.indexOf(',') + 1);
          if(b64.length > 1700000 && tries < 6){ tries++; q = Math.max(0.5, q - 0.08); scale *= 0.85; return attempt(); }
          URL.revokeObjectURL(url);
          if(b64.length > 1700000) return bad();
          resolve(b64);
        }
        attempt();
      };
      img.onerror = function(){ URL.revokeObjectURL(url); bad(); };
      img.src = url;
    });
  }
  function uploadImages(fileList){
    var pid = selectedId;
    var list = Array.prototype.slice.call(fileList || []).filter(function(f){ return /^image\//.test(f.type); });
    if(!list.length){ toast('Choose an image file.', true); return; }
    var room = 12 - images.length;
    if(room <= 0){ toast('Up to 12 images per project.', true); return; }
    if(list.length > room){ list = list.slice(0, room); toast('Only ' + room + ' more fit. Adding the first ' + room + '.'); }
    toast('Uploading ' + list.length + (list.length === 1 ? ' image…' : ' images…'));
    run(function(){
      var chain = Promise.resolve();
      list.forEach(function(f){
        chain = chain.then(function(){
          return compress(f).then(function(b64){ return api('POST', '/api/projects/' + pid + '/images', { caption: '', mime: 'image/jpeg', data: b64 }); });
        });
      });
      return chain;
    }, list.length === 1 ? 'Image added' : list.length + ' images added');
  }

      if(e && e.status === 401) lock('The passcode was not accepted. Unlock editing again.');
      else toast((e && e.message && e.status === 400) ? e.message : 'Could not save. Try again.', true);
    });
  }

  function submitUnlock(e){
    e.preventDefault();
    var key = document.getElementById('f-key').value;
    if(!key){ setErr('Enter the passcode.'); return; }
    api('POST', '/api/auth', {}, key).then(function(){
      editKey = key; canEdit = true; lsSet('projectlog.key', key);
      closeModal(); render(); toast('Editing unlocked');
    }).catch(function(err){
      setErr(err && err.status === 401 ? 'That passcode is not right.' : 'Could not check the passcode. Try again.');
    });
  }

  function submitProject(e){
    e.preventDefault();
    var name = val('f-pname');
    if(!name){ setErr('Enter a project name.'); return; }
    var data = { name: name, client: val('f-client'), po: val('f-po'), notes: val('f-notes') };
    var existing = modalState && modalState.id;
    var tpl = document.getElementById('f-tpl');
    var useTpl = tpl && tpl.checked;
    closeModal();
    if(existing){
      run(function(){ return api('PATCH', '/api/projects/' + existing, data); }, 'Details saved');
    } else {
      data.tasks = useTpl ? templateTasks() : [];
      run(function(){
        return api('POST', '/api/projects', data).then(function(res){ selectedId = res.id; lsSet('projectlog.selected', res.id); needScroll = true; });
      }, 'Project created');
    }
  }

  function submitTask(e){
    e.preventDefault();
    var group = val('f-group'), name = val('f-name');
    var ps = val('f-ps'), pd = val('f-pd'), as = val('f-as'), ae = val('f-ae');
    if(!group){ setErr('Enter the main process.'); return; }
    if(!name){ setErr('Enter the sub process.'); return; }
    if(ps && pd && pd < ps){ setErr('The due date is before the start date.'); return; }
    if(ae && !as) as = ae;
    if(as && ae && ae < as){ setErr('The finish date is before the start date.'); return; }
    var data = { group: group, name: name, incharge: val('f-who'), planStart: ps, planDue: pd, actStart: as, actEnd: ae };
    var id = modalState && modalState.id, pid = (modalState && modalState.pid) || selectedId;
    var old = id ? tasks.filter(function(t){ return t.id === id; })[0] : null;
    closeModal();
    if(id){
      if(old && old.group !== group) data.order = orderFor(group, id, pid);
      run(function(){ return api('PATCH', '/api/tasks/' + id, data); }, 'Process saved');
    } else {
      data.order = orderFor(group, null, pid);
      run(function(){ return api('POST', '/api/projects/' + pid + '/tasks', data); }, 'Process added');
    }
  }

  function submitDuplicate(e){
    e.preventDefault();
    var name = val('f-dname');
    if(!name){ setErr('Enter a name for the new project.'); return; }
    var src = modalState && modalState.id;
    var data = { name: name, client: val('f-dclient'), po: val('f-dpo'), keepDates: document.getElementById('f-keep').checked, copyImages: document.getElementById('f-imgs').checked };
    closeModal();
    run(function(){
      return api('POST', '/api/projects/' + src + '/duplicate', data).then(function(res){ selectedId = res.id; lsSet('projectlog.selected', res.id); needScroll = true; });
    }, 'Project duplicated');
  }
  function submitRename(e){
    e.preventDefault();
    var to = val('f-gname'), from = modalState && modalState.group, pid = (modalState && modalState.pid) || selectedId;
    if(!to){ setErr('Enter a name.'); return; }
    if(to === from){ closeModal(); return; }
    closeModal();
    run(function(){ return api('POST', '/api/projects/' + pid + '/rename-group', { from: from, to: to }); }, 'Renamed');
  }
  function submitImage(e){
    e.preventDefault();
    var id = modalState && modalState.id, cap = val('f-cap');
    closeModal();
    run(function(){ return api('PATCH', '/api/images/' + id, { caption: cap }); }, 'Caption saved');
  }

  function statusPatch(t, val){
    var as = t.actStart || '', ae = t.actEnd || '', td = iso(TODAY);
    if(val === 'todo') return { actStart: '', actEnd: '' };
    if(val === 'progress') return { actStart: as || td, actEnd: '' };
    return { actStart: as || td, actEnd: ae || td };
  }
  var STATUS_MSG = { todo: 'Set to not started', progress: 'Set to in progress', done: 'Marked done' };
  function quick(id, patch, msg){
    run(function(){ return api('PATCH', '/api/tasks/' + id, patch); }, msg);
  }

  function loadTemplate(){
    var pid = selectedId;
    run(function(){ return api('POST', '/api/projects/' + pid + '/tasks', { tasks: templateTasks() }); }, 'Standard processes added');
  }

  function armDelete(btn, what, doIt){
    if(btn.dataset.armed !== '1'){
      btn.dataset.armed = '1'; btn.classList.add('armed'); btn.textContent = 'Confirm delete';
      setTimeout(function(){ if(btn.isConnected){ btn.dataset.armed = ''; btn.classList.remove('armed'); btn.textContent = what; } }, 4000);
      return;
    }
    doIt();
  }

  /* ---------- events ---------- */
  document.addEventListener('click', function(e){
    var el = e.target.closest('[data-act]');
    if(!el) return;
    var act = el.dataset.act;
    if(act === 'scrim'){ if(e.target === el) closeModal(); return; }
    if(act === 'close-modal'){ closeModal(); return; }
    if(act === 'retry'){ loadFailed = false; render(); load(true); return; }
    if(act === 'unlock'){ openUnlockModal(); return; }
    if(act === 'lock'){ lock(); toast('Editing locked'); return; }
    if(act === 'toggle-subject'){ lsSet('projectlog.subject', lsGet('projectlog.subject') === 'closed' ? 'open' : 'closed'); render(); return; }
    if(act === 'open-image'){ openLightbox(el.dataset.id); return; }
    if(act === 'lb-bg'){ if(e.target === el) closeModal(); return; }
    if(act === 'lb-prev'){ if(modalState && modalState.i > 0){ modalState.i--; drawLightbox(); } return; }
    if(act === 'lb-next'){ if(modalState && modalState.i < images.length - 1){ modalState.i++; drawLightbox(); } return; }
    if(act === 'cal-prev' || act === 'cal-next'){
      var cw = appEl.querySelector('.sched-wrap');
      if(cw) cw.scrollBy({ left: (act === 'cal-prev' ? -1 : 1) * (+el.dataset.days || 7) * DW, behavior: 'smooth' });
      return;
    }
    if(act === 'cal-today'){ var tw = appEl.querySelector('.sched-wrap'); if(tw) scrollToToday(tw, true); return; }
    if(act === 'reset-filters'){ filters = { q: '', client: '', who: '', group: '', status: '', time: '', from: '', to: '' }; needScroll = true; render(); return; }
    if(act === 'open-project'){ selectProject(el.dataset.id); window.scrollTo(0, 0); return; }
    if(!canEdit) return;
    if(act === 'new-project') openProjectModal(null);
    else if(act === 'edit-project'){ var p = currentProject(); if(p) openProjectModal(p); }
    else if(act === 'add-task') openTaskModal(null, el.dataset.group || '');
    else if(act === 'edit-task'){ var t = tasks.filter(function(x){ return x.id === el.dataset.id; })[0]; if(t) openTaskModal(t); }
    else if(act === 'task-start') quick(el.dataset.id, { actStart: iso(TODAY), actEnd: '' }, 'Started today');
    else if(act === 'task-finish'){
      var tt = tasks.filter(function(x){ return x.id === el.dataset.id; })[0];
      quick(el.dataset.id, { actEnd: iso(TODAY), actStart: (tt && tt.actStart) || iso(TODAY) }, 'Finished today');
    }
    else if(act === 'task-reopen') quick(el.dataset.id, { actEnd: '' }, 'Reopened');
    else if(act === 'load-template') loadTemplate();
    else if(act === 'duplicate-project'){ var dp = currentProject(); if(dp) openDuplicateModal(dp); }
    else if(act === 'rename-group') openRenameModal(el.dataset.group, el.dataset.pid);
    else if(act === 'move-up') moveTask(el.dataset.id, -1);
    else if(act === 'move-down') moveTask(el.dataset.id, 1);
    else if(act === 'add-images'){ var inp = document.getElementById('imgInput'); if(inp) inp.click(); }
    else if(act === 'edit-image'){ var im = images.filter(function(x){ return x.id === el.dataset.id; })[0]; if(im) openImageModal(im); }
    else if(act === 'img-left'){ var li = modalState && modalState.id; closeModal(); moveImage(li, -1); }
    else if(act === 'img-right'){ var ri = modalState && modalState.id; closeModal(); moveImage(ri, 1); }
    else if(act === 'delete-image'){
      var iid = modalState && modalState.id;
      armDelete(el, 'Delete image', function(){ closeModal(); run(function(){ return api('DELETE', '/api/images/' + iid); }, 'Image deleted'); });
    }
    else if(act === 'delete-task'){
      var id = modalState && modalState.id;
      armDelete(el, 'Delete', function(){ closeModal(); run(function(){ return api('DELETE', '/api/tasks/' + id); }, 'Process deleted'); });
    }
    else if(act === 'delete-project'){
      var proj = currentProject(); if(!proj) return;
      armDelete(el, 'Delete project', function(){
        closeModal();
        run(function(){ return api('DELETE', '/api/projects/' + proj.id).then(function(){ selectedId = null; }); }, 'Project deleted');
      });
    }
  });
  document.addEventListener('submit', function(e){
    if(e.target.id === 'projForm') submitProject(e);
    else if(e.target.id === 'taskForm') submitTask(e);
    else if(e.target.id === 'unlockForm') submitUnlock(e);
    else if(e.target.id === 'dupForm') submitDuplicate(e);
    else if(e.target.id === 'renameForm') submitRename(e);
    else if(e.target.id === 'imgForm') submitImage(e);
  });
  document.addEventListener('change', function(e){
    var tid = e.target.id || '';
    if(tid === 'projectSelect') selectProject(e.target.value);
    else if(/^flt-/.test(tid) && tid !== 'flt-q'){
      var k = tid.slice(4);
      filters[k] = e.target.value;
      if(k === 'client' && e.target.value && selectedId !== ALL && projects.length > 1){
        selectedId = ALL; lsSet('projectlog.selected', ALL); setScope(); needScroll = true;
      }
      if(k === 'time' || k === 'from' || k === 'to') needScroll = true;
      render();
    }
    else if(tid === 'zoomSel') setZoom(+e.target.value);
    else if(tid === 'f-status'){
      var sv = e.target.value, fa = document.getElementById('f-as'), fe = document.getElementById('f-ae'), td = iso(TODAY);
      if(fa && fe){
        if(sv === 'todo'){ fa.value = ''; fe.value = ''; }
        else if(sv === 'progress'){ if(!fa.value) fa.value = td; fe.value = ''; }
        else { if(!fa.value) fa.value = td; if(!fe.value) fe.value = td; }
      }
    }
    else if(e.target.classList && e.target.classList.contains('st-sel')){
      if(!canEdit) return;
      var stt = tasks.filter(function(x){ return x.id === e.target.dataset.id; })[0];
      if(stt) quick(stt.id, statusPatch(stt, e.target.value), STATUS_MSG[e.target.value]);
    }
    else if(e.target.id === 'imgInput'){ var fl = e.target.files; uploadImages(fl); e.target.value = ''; }
  });
  document.addEventListener('input', function(e){
    var tid = e.target.id;
    if(tid === 'calSlider'){ var w = appEl.querySelector('.sched-wrap'); if(w) w.scrollLeft = +e.target.value; }
    else if(tid === 'flt-q'){ filters.q = e.target.value; render(); }
  });
  document.addEventListener('keydown', function(e){
    if(e.target && e.target.id === 'calSlider' && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){
      var sw = appEl.querySelector('.sched-wrap');
      if(sw){ e.preventDefault(); sw.scrollBy({ left: (e.key === 'ArrowLeft' ? -1 : 1) * DW * 7, behavior: 'smooth' }); }
      return;
    }
    if(!modalState) return;
    if(e.key === 'Escape'){ closeModal(); return; }
    if(modalState.type === 'lightbox'){
      if(e.key === 'ArrowLeft' && modalState.i > 0){ modalState.i--; drawLightbox(); }
      else if(e.key === 'ArrowRight' && modalState.i < images.length - 1){ modalState.i++; drawLightbox(); }
    }
  });

  /* calendar: keep the slider in step with scrolling, and drag to pan with the mouse */
  document.addEventListener('scroll', function(e){
    if(e.target && e.target.classList && e.target.classList.contains('sched-wrap')) syncSlider();
  }, true);
  window.addEventListener('resize', syncSlider);
  var drag = null;
  document.addEventListener('mousedown', function(e){
    if(e.button !== 0 || !e.target.closest) return;
    var w = e.target.closest('.sched-wrap');
    if(!w || !e.target.closest('table') || e.target.closest('button,input,select,a')) return;
    drag = { w: w, x: e.clientX, y: e.clientY, sl: w.scrollLeft, st: w.scrollTop, moved: false };
  });
  document.addEventListener('mousemove', function(e){
    if(!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if(!drag.moved){
      if(Math.abs(dx) + Math.abs(dy) < 4) return;
      drag.moved = true; drag.w.classList.add('dragging');
    }
    drag.w.scrollLeft = drag.sl - dx; drag.w.scrollTop = drag.st - dy;
    e.preventDefault();
  });
  document.addEventListener('mouseup', function(){ if(drag){ drag.w.classList.remove('dragging'); drag = null; } });

  /* live refresh: poll while the tab is visible */
  setInterval(function(){ if(document.visibilityState === 'visible' && !modalState) load(false); }, POLL_MS);
  document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') load(false); });

  /* ---------- boot ---------- */
  render();
  var saved = lsGet('projectlog.key');
  if(saved){
    api('POST', '/api/auth', {}, saved).then(function(){ editKey = saved; canEdit = true; render(); }).catch(function(e){
      if(e && e.status === 401) lsDel('projectlog.key');
    });
  }
  load(true);
})();
</script>
</body>
</html>
